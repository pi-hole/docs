name: Compress Images

on:
  pull_request:
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.webp'
      - '**.avif'
  workflow_dispatch:
  # Trigger on push to the master branch to compress images from forks
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    # Only run on Pull Requests within the same repository, and not from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: calibreapp/image-actions
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the compressed images to the pull request branch
      pull-requests: write # to comment on the pull request
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Compress Images
        id: calibre
        # TODO: if they start using a tag like v1, switch to that
        uses: calibreapp/image-actions@9d037c06280028c110ff61c433ad4dc7d33c3c43 #1.5.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For non-Pull Requests, run in compressOnly mode and we'll PR after.
          compressOnly: ${{ github.event_name != 'pull_request' }}

      # If it's not a Pull Request then commit any changes as a new PR.
      - name: Create Pull Request if needed
        if: |
          github.event_name != 'pull_request' &&
          steps.calibre.outputs.markdown != ''
        run: gh pr create -B image_compress -H master --title 'Auto Compress Images' --body "$BODY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.calibre.outputs.markdown }}
